# Native leaderboard-metric definitions, keyed by dataset then metric. Wording
# lifted from each evaluator's docstring/CAVEATS so it matches the code.
native_metric_defs:
  planbench_blocksworld:
    solve_rate: >-
      **Solve rate** — plan *validity* (PlanBench's official metric, not
      exact-match): an action sequence scores 1 iff, executed from the initial
      state under standard IPC Blocksworld semantics, every precondition holds
      and the goal is reached. Alternative valid orderings also score 1.
      Un-parseable JSON or a malformed plan scores 0.
  natural_plan_trip:
    solve_rate: >-
      **Solve rate** — official NATURAL PLAN trip exact-match: the predicted
      `(city, days)` sequence must match the gold itinerary for every gold stay,
      in order (short predictions fail; extra trailing stays are ignored).
      Un-parseable JSON scores 0.
  natural_plan_meeting:
    solve_rate: >-
      **Solve rate** — official NATURAL PLAN meeting metric: a validator walks
      the schedule (travel via the distance matrix, per-person availability
      windows, no duplicates) and counts valid meetings; the example scores 1
      iff that count equals the golden plan's optimum. Un-parseable JSON scores 0.
  sentence_ordering_arxiv:
    pmr: >-
      **PMR (Perfect-Match Ratio)** — fraction of examples whose predicted order
      exactly matches the single gold order (strict).
    tau: >-
      **Kendall's τ** — mean rank correlation between predicted and gold order in
      $[-1,1]$ (1 identical, −1 reversed). A response that does not parse to a
      valid permutation of $1..N$ contributes PMR 0, τ 0.
  sentence_ordering_rocstories:
    pmr: >-
      **PMR (Perfect-Match Ratio)** — fraction of examples whose predicted order
      exactly matches the single gold order (strict).
    tau: >-
      **Kendall's τ** — mean rank correlation between predicted and gold order in
      $[-1,1]$ (1 identical, −1 reversed). A response that does not parse to a
      valid permutation of $1..N$ contributes PMR 0, τ 0.
  scierc_native_exact:
    rel_entity_f1: >-
      **Rel (entity-level) F1** — headline coref-aware relation F1: gold
      mention-pair relations are projected to gold-cluster pairs, predicted
      clusters are aligned to gold clusters by shared resolved spans, and
      relations are matched at the cluster level. Micro-averaged; symmetric
      relations match in either order.
    rel_plus_entity_f1: >-
      **Rel+ (entity-level) F1** — as Rel but the argument entity *types* must
      also match (strict).
    ner_f1: >-
      **NER F1** — mention-level span+type micro-F1; this is the PURE /
      PL-Marker / DyGIE++ “Ent” metric, 1:1. Predicted mention spans are
      re-anchored to the raw token sequence by first-unused-occurrence
      case-insensitive match; un-anchorable mentions are dropped.
  amr_littleprince:
    smatch_f1: >-
      **Smatch F1** — the canonical AMR metric (Cai & Knight 2013): search for
      the variable alignment between predicted and gold graphs that maximises
      matched triples (instances, relations, attributes), then micro-averaged
      F1 over the corpus. Computed with the official `smatch` package; a
      response that fails to parse to a non-empty graph contributes 0 matched
      triples (all gold triples become false negatives).
  amr_bio:
    smatch_f1: >-
      **Smatch F1** — the canonical AMR metric (Cai & Knight 2013): search for
      the variable alignment between predicted and gold graphs that maximises
      matched triples (instances, relations, attributes), then micro-averaged
      F1 over the corpus. Computed with the official `smatch` package; a
      response that fails to parse to a non-empty graph contributes 0 matched
      triples (all gold triples become false negatives).
  wec_eng:
    conll_f1: >-
      **CoNLL F1** — the standard coreference headline: the unweighted mean of
      the MUC, B³, and CEAFe F1 scores, computed over the marker partition of
      each instance (micro-averaged across instances). A response that does not
      parse (or carries no events) is scored as the all-singletons partition.
    muc_f1: >-
      **MUC F1** — link-based coreference F1 (Vilain et al. 1995): counts the
      coreference links correctly recovered, insensitive to singletons.
    b3_f1: >-
      **B³ F1** — mention-based coreference F1 (Bagga & Baldwin 1998):
      per-mention precision/recall over the gold vs predicted cluster a mention
      lands in, averaged over mentions.
    ceafe_f1: >-
      **CEAFe F1** — entity-based coreference F1 (Luo 2005): best 1:1 alignment
      between gold and predicted clusters under the φ4 (entity) similarity.
    lea_f1: >-
      **LEA F1** — link-based entity-aware coreference F1 (Moosavi & Strube
      2016): each cluster is weighted by its size and scored by the fraction of
      its coreference links it shares with the other side.
