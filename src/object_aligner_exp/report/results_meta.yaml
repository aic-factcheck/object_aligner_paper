# Descriptive prose for the deterministic results report. The ONLY hand-written
# text in the generated document — kept here (not in code or templates) so it is
# easy to review/edit. Loaded by report/results.py. All numbers in the report
# are computed; nothing here is a metric value.

# OA graded-score definition (rendered in §1). LaTeX math allowed.
oa_score_def: >-
  **OA graded score** — Object-Aligner's deterministic, schema-driven graded
  list-alignment score in $[0,1]$ (the GEPA reward). A response that fails to
  decode to valid JSON or violates the schema scores exactly $0$ and is counted
  as a *failed sample* (`n_zero`). All scores are on their native scale
  **$[0,1]$** (1 = perfect; never percentages). Means are reported per schema
  *kind* as the zero-excluded mean (`mean_score_nonzero`); per-cell
  failed-sample counts and the all-samples mean are omitted by default (enable
  with `--failed-samples` / `--appendix`). Each run is scored under **every**
  schema kind of its dataset
  (so the per-dataset table is also a cross-schema view), with `★` marking the
  kind the run was optimised on (`primary_kind`). NB some schema kinds are
  intentionally lenient — e.g. the sentence-ordering *Hungarian* schema is
  order-insensitive and scores ~1.0 for any permutation — so compare *across the
  same kind* (column), not across an ablation's own primary kind.

# Per-dataset display: title + one-line task description.
dataset_display:
  natural_plan_meeting:
    title: NATURAL PLAN — Meeting Planning
    blurb: >-
      Schedule a day of meetings around a city subject to per-person
      location/availability windows and pairwise travel times.
  natural_plan_trip:
    title: NATURAL PLAN — Trip Planning
    blurb: >-
      Order a multi-city itinerary so each city is visited for its required
      number of days under flight-connectivity constraints.
  planbench_blocksworld:
    title: PlanBench — Blocksworld
    blurb: >-
      Generate an action plan that transforms the initial block configuration
      into the goal configuration.
  scierc_native_exact:
    title: SciERC
    blurb: >-
      Extract a coreference-merged scientific knowledge graph (typed entities +
      typed relations) from an abstract.
  amr_littleprince:
    title: AMR — Little Prince
    blurb: >-
      Parse an English sentence into its Abstract Meaning Representation graph
      (concept nodes + role edges, with reentrancy). Variable names are
      arbitrary, so referential alignment (amr_ra) reproduces the standard
      Smatch metric and the ra-vs-strict gap is pure id-routing.
  amr_bio:
    title: AMR — Bio (USC/ISI)
    blurb: >-
      Parse a biomedical English sentence (cancer-research text) into its
      Abstract Meaning Representation graph (concept nodes + role edges, with
      reentrancy). Same wire shape and schema pair as Little Prince: variable
      names are arbitrary, so referential alignment (amr_ra) reproduces the
      standard Smatch metric and the ra-vs-strict gap is pure id-routing.
  sentence_ordering_arxiv:
    title: Sentence Ordering — arXiv abstracts
    blurb: >-
      Recover the original reading order of shuffled sentences from arXiv
      abstracts (6–12 sentences).
  sentence_ordering_rocstories:
    title: Sentence Ordering — ROCStories
    blurb: >-
      Recover the original reading order of the five shuffled sentences of a
      ROCStories narrative.
  synra_nl_hard:
    title: SynRA-NL (hard)
    blurb: >-
      Synthetic natural-language → relational-graph extraction
      (people/companies/employment), hard split.
  synra_nl_pilot:
    title: SynRA-NL (pilot)
    blurb: Synthetic natural-language → relational-graph extraction, pilot split.
  synra_codex_noobf:
    title: SynRA-Codex (no obfuscation)
    blurb: >-
      Synthetic code → relational-graph extraction, identifiers left readable.
  synra_codex_noobf6:
    title: SynRA-Codex (no obfuscation, depth 6)
    blurb: >-
      Synthetic code → relational-graph extraction, readable identifiers,
      deeper variant.
  synra_codex_obf:
    title: SynRA-Codex (obfuscated)
    blurb: Synthetic code → relational-graph extraction, identifiers obfuscated.
  synra_codex_obf6:
    title: SynRA-Codex (obfuscated, depth 6)
    blurb: >-
      Synthetic code → relational-graph extraction, obfuscated identifiers,
      deeper variant.
  graphimg_v2:
    title: GraphImg v2
    blurb: >-
      Image → relational-graph extraction from rendered graph images (v2
      generator).
  graphimg_v3:
    title: GraphImg v3
    blurb: >-
      Image → relational-graph extraction from rendered graph images (v3
      generator, medium difficulty).
  wec_eng:
    title: WEC-Eng
    blurb: >-
      Cross-document event coreference: group tagged event mentions that refer
      to the same real-world event. Mapped onto OA as a membership multigraph
      (mentions = idScope aligned by an echoed marker; each event lists its
      members as refs). Gold cluster/mention ids are opaque, non-derivable
      integers, so the literal-id strict baseline is near-degenerate while RA
      routes the partition.

